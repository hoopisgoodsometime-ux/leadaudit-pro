<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled — Influencer Audit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a28; --border: #2a2a3e; --text: #f0f0ff; --subtext: #8888aa; --accent: #6366f1; --accent2: #8b5cf6; --red: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px; max-width: 460px; width: 90%; text-align: center; }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; color: var(--red); }
        p { color: var(--subtext); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
        .btn { display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; border-radius: 12px; font-weight: 600; font-size: 0.95rem; text-decoration: none; transition: all 0.15s; }
        .btn:hover { opacity: 0.88; transform: translateY(-2px); }
        .free-link { display: block; margin-top: 16px; color: var(--subtext); font-size: 0.85rem; text-decoration: none; }
        .free-link:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">❌</div>
        <h1>Payment Cancelled</h1>
        <p>No worries — your payment was cancelled and you won't be charged. You can still use the free daily audit or try again anytime.</p>
        <a href="/pricing" class="btn">View Pricing →</a>
        <a href="/" class="free-link">← Back to free audit</a>
    </div>
</body>
</html>
