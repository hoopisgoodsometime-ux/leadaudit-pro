<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled — LeadAudit Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #080b14;
            --surface: rgba(16, 23, 42, 0.85);
            --border: rgba(148, 163, 184, 0.1);
            --text: #f1f5f9;
            --subtext: #94a3b8;
            --accent: #6366f1;
            --accent2: #8b5cf6;
            --red: #ef4444;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(239,68,68,0.08), transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }
        .card {
            background: var(--surface);
            border: 1px solid rgba(239,68,68,0.15);
            border-radius: 28px;
            padding: 52px 44px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(30px);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-wrap {
            width: 80px; height: 80px;
            background: rgba(239,68,68,0.08);
            border: 2px solid rgba(239,68,68,0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 2.4rem;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--red);
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: var(--subtext);
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 0 25px rgba(99,102,241,0.3);
            margin-bottom: 12px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(99,102,241,0.45);
        }
        .free-link {
            display: block;
            color: var(--subtext);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .free-link:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">✗</div>
        <h1>Payment Cancelled</h1>
        <p class="subtitle">No worries — nothing was charged. You can try again anytime, or start with a free website audit instead.</p>
        <a href="/pricing" class="btn">View Pricing →</a>
        <br>
        <a href="/website-audit" class="free-link">← Run a free website audit instead</a>
    </div>
</body>
</html>
